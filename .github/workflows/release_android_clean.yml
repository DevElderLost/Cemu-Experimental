name: Build clean Android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major (e.g. 0)
        required: true
        type: string
        default: '0'
      version_minor:
        description: Version minor (e.g. 4)
        required: true
        type: string
        default: '4'
      version_patch:
        description: Version patch (e.g. 1)
        required: false
        type: string
        default: '0'
      publish_release:
        description: Publish a GitHub release after artifact build
        required: false
        type: boolean
        default: false

env:
  VCPKG_ROOT: "${{github.workspace}}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build:
    name: Build and scan APK (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: odin
            application_id: info.cemu.cemu.odin
            artifact_suffix: odin
          - variant: classic
            application_id: info.cemu.cemu
            artifact_suffix: classic

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile $mo_file"
          done

      - name: Setup vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build APK
        env:
          ANDROID_STORE_FILE_BASE64: ${{ secrets.ANDROID_STORE_FILE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EMULATOR_VERSION_MAJOR: ${{ inputs.version_major }}
          EMULATOR_VERSION_MINOR: ${{ inputs.version_minor }}
          EMULATOR_VERSION_PATCH: ${{ inputs.version_patch }}
          ANDROID_APPLICATION_ID: ${{ matrix.application_id }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64

          cd ./src/android

          if [[ -n "$ANDROID_STORE_FILE_BASE64" ]]; then
            base64 --decode <<< "${ANDROID_STORE_FILE_BASE64}" > store.jks
            export ANDROID_STORE_FILE=$(pwd)/store.jks
            echo "Android signing store file configured."
          else
            echo "WARNING: No signing key provided. APK will use debug signing."
          fi

          ./gradlew assembleRelease

      - name: Set version dependent vars
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          if [[ "${{ inputs.version_patch }}" != "" && "${{ inputs.version_patch }}" != "0" ]]; then
            VERSION="${VERSION}.${{ inputs.version_patch }}"
          fi
          echo "CEMU_VERSION=$VERSION" >> $GITHUB_ENV
          echo "CEMU_ARTIFACT_SUFFIX=${{ matrix.artifact_suffix }}" >> $GITHUB_ENV

      - name: Strip .comment sections from native libraries
        run: |
          # Resolve tool paths from Android SDK/NDK
          NDK_DIR="$ANDROID_NDK_HOME"
          OBJCOPY=$(find "$NDK_DIR/toolchains/llvm/prebuilt" -name "llvm-objcopy" | head -1)
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "Using objcopy: $OBJCOPY"
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          APK_DIR="src/android/app/build/outputs/apk/release"
          APK=$(ls $APK_DIR/*.apk | head -1)
          WORK_DIR=$(mktemp -d)

          cd $WORK_DIR
          unzip -q "$GITHUB_WORKSPACE/$APK"

          # Strip .comment sections that contain compiler paths
          for so in lib/arm64-v8a/*.so; do
            if [ -f "$so" ]; then
              echo "Stripping .comment from $so"
              "$OBJCOPY" --remove-section .comment "$so" || true
            fi
          done

          # Repackage APK (store resources.arsc uncompressed for Android R+ requirement)
          rm -f "$GITHUB_WORKSPACE/$APK"
          zip -r -q -0 "$GITHUB_WORKSPACE/$APK" resources.arsc
          zip -r -q "$GITHUB_WORKSPACE/$APK" . -x resources.arsc

          # Re-align (page-align shared libs for Android 11+)
          cd "$GITHUB_WORKSPACE"
          "$ZIPALIGN" -p -f 4 "$APK" "${APK}.aligned"
          mv "${APK}.aligned" "$APK"

          # Re-sign if keystore is available
          if [[ -f "src/android/store.jks" ]]; then
            "$APKSIGNER" sign \
              --ks src/android/store.jks \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" \
              "$APK"
          else
            "$APKSIGNER" sign \
              --ks ~/.android/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              "$APK"
          fi

          rm -rf $WORK_DIR

      - name: PII scan
        run: |
          APK_DIR="src/android/app/build/outputs/apk/release"
          APK=$(ls $APK_DIR/*.apk | head -1)
          WORK_DIR=$(mktemp -d)

          cd $WORK_DIR
          unzip -q "$GITHUB_WORKSPACE/$APK"

          echo "=== Scanning APK for PII leaks ==="
          FOUND=0

          # Patterns that should never appear in a release build
          # Add your username, paths, email patterns here
          PII_PATTERNS=(
            'C:/Users/'          # Windows user paths
            'C:\\Users\\'        # Windows user paths (backslash)
            '/Users/[a-z]'       # macOS home dirs
            'OdinDebug'          # Repo-specific path
          )
          # Note: /home/runner/ paths from CI are expected and safe (generic GitHub Actions runner)

          for pattern in "${PII_PATTERNS[@]}"; do
            MATCHES=$(grep -rl "$pattern" . 2>/dev/null || true)
            if [[ -n "$MATCHES" ]]; then
              echo "FAIL: Pattern '$pattern' found in:"
              for f in $MATCHES; do
                # Show context around the match
                grep -o ".\{0,40\}${pattern}.\{0,40\}" "$f" 2>/dev/null | head -5 | while read line; do
                  echo "  $f: $line"
                done
              done
              FOUND=1
            fi
          done

          # Also scan strings from .so files specifically
          for so in lib/arm64-v8a/*.so; do
            if [ -f "$so" ]; then
              for pattern in "${PII_PATTERNS[@]}"; do
                HITS=$(strings "$so" | grep -i "$pattern" || true)
                if [[ -n "$HITS" ]]; then
                  echo "FAIL: '$pattern' found in strings of $so:"
                  echo "$HITS" | head -5 | sed 's/^/  /'
                  FOUND=1
                fi
              done
            fi
          done

          rm -rf $WORK_DIR

          if [[ $FOUND -eq 1 ]]; then
            echo ""
            echo "=== PII SCAN FAILED ==="
            echo "The APK contains personal/local build paths."
            echo "This should not happen on CI. Check build configuration."
            exit 1
          fi

          echo "=== PII scan PASSED — no personal information found ==="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-${{ env.CEMU_VERSION }}-android-${{ env.CEMU_ARTIFACT_SUFFIX }}
          path: src/android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.CEMU_VERSION }}"
          SUFFIX="${{ env.CEMU_ARTIFACT_SUFFIX }}"
          APK_DIR="src/android/app/build/outputs/apk/release"
          APK=$(ls $APK_DIR/*.apk | head -1)
          FINAL_APK="$APK_DIR/Cemu-${VERSION}-android-${SUFFIX}.apk"
          mv "$APK" "$FINAL_APK"

          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "Cemu Android ${VERSION}" \
              --notes "Android release ${VERSION}" \
              || gh release view "v${VERSION}" >/dev/null
          fi

          gh release upload "v${VERSION}" "$FINAL_APK" --clobber
